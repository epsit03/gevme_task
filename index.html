<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Step Form</title>
  <style>
    /* Inline Styles for Form */
    * {margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif;}
    body {display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f7f7f7;}
    #msform {width: 100%; max-width: 500px; text-align: center; position: relative;}
    #progressbar {display: flex; justify-content: space-between; margin-bottom: 20px; counter-reset: step;}
    #progressbar li {list-style-type: none; width: 33%; text-align: center; position: relative;}
    #progressbar li:before {content: counter(step); counter-increment: step; width: 30px; height: 30px; line-height: 30px; border: 2px solid #3498db; display: block; text-align: center; margin: 0 auto 10px auto; border-radius: 50%; background: #fff;}
    #progressbar li.active:before {background: #3498db; color: #fff;}
    fieldset {display: none;}
    fieldset.active {display: block;}
    .action-button {width: 100px; background: #3498db; border: none; padding: 10px; color: white; border-radius: 5px; cursor: pointer; margin: 10px 5px;}
    .action-button:disabled {background: #cccccc; cursor: not-allowed;}
  </style>
</head>
<body>

<!-- Multi-Step Form -->
<form id="msform">
  <!-- progressbar -->
  <ul id="progressbar">
    <li class="active">Account Setup</li>
    <li>Social Profiles</li>
    <li>Personal Details</li>
  </ul>
  <!-- fieldsets -->
  <fieldset class="active">
    <h2 class="fs-title">Create your account</h2>
    <h3 class="fs-subtitle">This is step 1</h3>
    <input type="text" name="email" placeholder="Email" required />
    <input type="password" name="pass" placeholder="Password" required />
    <input type="password" name="cpass" placeholder="Confirm Password" required />
    <button type="button" class="next action-button">Next</button>
  </fieldset>
  <fieldset>
    <h2 class="fs-title">Social Profiles</h2>
    <h3 class="fs-subtitle">Your presence on social media</h3>
    <input type="text" name="twitter" placeholder="Twitter" />
    <input type="text" name="facebook" placeholder="Facebook" />
    <input type="text" name="gplus" placeholder="Google Plus" />
    <button type="button" class="previous action-button">Previous</button>
    <button type="button" class="next action-button">Next</button>
  </fieldset>
  <fieldset>
    <h2 class="fs-title">Personal Details</h2>
    <h3 class="fs-subtitle">We will never sell it</h3>
    <input type="text" name="fname" placeholder="First Name" />
    <input type="text" name="lname" placeholder="Last Name" />
    <input type="text" name="phone" placeholder="Phone" />
    <textarea name="address" placeholder="Address"></textarea>
    <button type="button" class="previous action-button">Previous</button>
    <a href="https://twitter.com/GoktepeAtakan" class="action-button" target="_top">Submit</a>
  </fieldset>
</form>

<script>
  // JavaScript for Multi-Step Form
  document.addEventListener('DOMContentLoaded', function() {
    const progressbar = document.querySelectorAll("#progressbar li");
    const fieldsets = document.querySelectorAll("fieldset");
    let currentStep = 0;

    function updateForm(step) {
      fieldsets.forEach((fieldset, index) => {
        fieldset.classList.toggle("active", index === step);
        progressbar[index].classList.toggle("active", index <= step);
      });
    }

    document.querySelectorAll(".next").forEach(button => {
      button.addEventListener("click", function() {
        if (currentStep < fieldsets.length - 1) {
          currentStep++;
          updateForm(currentStep);
        }
      });
    });

    document.querySelectorAll(".previous").forEach(button => {
      button.addEventListener("click", function() {
        if (currentStep > 0) {
          currentStep--;
          updateForm(currentStep);
        }
      });
    });
  });
</script>

</body>
</html>
